name: IBPM CR - Monitoramento Fila 1 (Vídeos Recentes 48h)

on:
  schedule:
    # Executa todos os dias às 08:00 BRT (11:00 UTC)
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  monitor_recent_videos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v3

      - name: Configurar ambiente Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar Dependências Mínimas
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client python-dotenv requests python-telegram-bot

      - name: Executar Varredura da Fila 1 (Vídeos Recentes 48h)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_PASTORAL_CHAT_ID: ${{ secrets.TELEGRAM_PASTORAL_CHAT_ID }}
        run: |
          python -c "
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path.cwd()))

          from src.core.youtube_api import YouTubeAPIClient
          from src.core.state_manager import StateManager

          print('🚀 Iniciando Varredura da Fila 1 (Vídeos das últimas 48h)...')
          
          # 1. Busca vídeos das últimas 48h no canal @ibpmcr7976
          yt_client = YouTubeAPIClient()
          recent_videos = yt_client.fetch_recent_videos(hours=48)
          
          # 2. Atualiza estado e deduplicação
          state_mgr = StateManager()
          for v in recent_videos:
              state_mgr.register_video(
                  video_id=v['video_id'],
                  title=v['title'],
                  published_at=v['published_at'],
                  view_count=v['view_count']
              )
          
          recent_ids = [v['video_id'] for v in recent_videos]
          state_mgr.update_queues(
              recent_ids=recent_ids,
              most_viewed_ids=state_mgr.state['queues']['most_viewed'],
              historical_ids=state_mgr.state['queues']['historical']
          )

          print(f'✅ Varredura concluída! {len(recent_videos)} vídeo(s) monitorado(s) na Fila 1.')
          print('Resumo do estado:', state_mgr.get_summary())
          "
